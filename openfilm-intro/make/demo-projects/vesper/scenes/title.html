<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Bodoni Moda'; font-weight: 500; src: url(../fonts/bodoni-moda-latin-500-normal.woff2) format('woff2'); font-display: block; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  /* the word rises through a window at the top of the picture, behind the bottle's cap */
  #window { position: absolute; left: 0; right: 0; top: 0; height: 270px; overflow: hidden; }
  #word { position: absolute; left: 0; right: 0; top: 34px; display: flex; justify-content: center; font: 500 236px/1 'Bodoni Moda', serif;
          letter-spacing: .055em; color: #f3e7cf; text-shadow: 0 2px 24px rgba(0,0,0,.25); white-space: nowrap; }
  #cap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #plate { display: none; }
</style>
</head>
<body>
<div id="window"><div id="word">VESPER</div></div>
<canvas id="cap" width="1920" height="1080"></canvas>
<video id="plate" src="../assets/video/vesper-a.mp4" muted playsinline preload="auto"></video>
<script>
/* The plate is its own clip under this page (film.html: vesper-a.mp4 from IN); this page keeps a copy of it to cut the
   cap out of: the cap is dark and neutral, the backdrop red, the letters cream, so a colour key finds it, frame by frame */
const IN = 0.7, KEY = { x: 760, y: 140, w: 400, h: 200 };
const plate = document.getElementById('plate'), word = document.getElementById('word');
const cap = document.getElementById('cap').getContext('2d', { willReadFrequently: true });
const clamp = (x) => Math.min(1, Math.max(0, x));
const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * x * (x * (x * 6 - 15) + 10); };
const seek = (s) => new Promise((ok) => {
  if (Math.abs(plate.currentTime - s) < 0.001 && plate.readyState >= 2) return ok();
  plate.addEventListener('seeked', () => ok(), { once: true }); plate.currentTime = s;
});
function key() {
  cap.clearRect(0, 0, 1920, 1080);
  cap.drawImage(plate, KEY.x, KEY.y, KEY.w, KEY.h, KEY.x, KEY.y, KEY.w, KEY.h);
  const img = cap.getImageData(KEY.x, KEY.y, KEY.w, KEY.h), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i + 1], b = d[i + 2], mx = Math.max(r, g, b), sat = r - Math.max(g, b);
    d[i + 3] = Math.round(255 * clamp((150 - mx) / 30) * clamp((22 - sat) / 10));
  }
  cap.putImageData(img, KEY.x, KEY.y);
}
window.film = {
  duration: 4.45,
  ready: Promise.all([document.fonts.load("500 236px 'Bodoni Moda'"), new Promise((ok) => { if (plate.readyState >= 2) ok(); else plate.addEventListener('loadeddata', ok, { once: true }); })]),
  async frame(t) {
    await seek(Math.min(IN + t, plate.duration - 0.04));
    key();
    const p = clamp((t - 0.1) / 3.9), lift = p * 0.72 + smooth(0, 1, p) * 0.28;
    word.style.opacity = String(smooth(0.05, 0.4, t));
    word.style.transform = `translateY(${225 * (1 - lift)}px)`;
  },
};
</script>
</body>
</html>
