<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Bodoni Moda'; font-weight: 500; src: url(../fonts/bodoni-moda-latin-500-normal.woff2) format('woff2'); font-display: block; }
  @font-face { font-family: 'Noto Sans SC'; src: url(../fonts/NotoSansSC.ttf); font-weight: 100 900; font-display: block; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0d0405; }
  #bg { position: absolute; inset: 0; background: radial-gradient(60% 70% at 50% 46%, #4a0e12 0%, #1d0507 55%, #0b0304 100%); }
  /* the word, with a light passing through its letters only */
  #word { position: absolute; left: 0; right: 0; top: 388px; text-align: center; font: 500 196px/1.1 'Bodoni Moda', serif; letter-spacing: .08em; white-space: nowrap;
          color: transparent; -webkit-background-clip: text; background-clip: text; }
  #sub { position: absolute; left: 0; right: 0; top: 640px; text-align: center; font: 300 30px/1 'Noto Sans SC', sans-serif; letter-spacing: .5em; color: rgba(243,231,207,.8); white-space: nowrap; }
</style>
</head>
<body>
<div id="bg"></div><div id="word">VESPER</div><div id="sub">十月九日 · 黄昏上市</div>
<script>
const $ = (id) => document.getElementById(id);
const clamp = (x) => Math.min(1, Math.max(0, x));
const ease = (a, b, t) => { const x = clamp((t - a) / (b - a)); return 1 - Math.pow(1 - x, 3); };
window.film = {
  duration: 3.4,
  ready: document.fonts.ready,
  frame(t) {
    const w = ease(0, 1.1, t), s = ease(0.7, 1.6, t);
    $('bg').style.opacity = String(ease(0, 0.5, t));
    $('word').style.opacity = String(w); $('word').style.letterSpacing = `${0.16 - 0.08 * w}em`;
    const x = -30 + 160 * clamp((t - 0.9) / 1.4);
    $('word').style.backgroundImage = `linear-gradient(105deg, #f3e7cf ${x - 12}%, #fffaf0 ${x}%, #f3e7cf ${x + 12}%)`;
    $('sub').style.opacity = String(s); $('sub').style.transform = `translateY(${(1 - s) * 12}px)`;
  },
};
</script>
</body>
</html>
