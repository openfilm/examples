let W = null, FO = 0;
/* when, from the line's own word timing */
async function words() {
  const raw = await (await fetch('assets/audio/vo/l7-v5.vtt')).text(); const chars = [];
  const sec = (h, m, x) => +h * 3600 + +m * 60 + +x;
  for (const cue of raw.split(/\n\n+/)) {
    const m = cue.match(/(\d\d):(\d\d):(\d\d\.\d+) --> (\d\d):(\d\d):(\d\d\.\d+)\n([\s\S]+)/);
    if (!m) continue;
    let t = sec(m[1], m[2], m[3]);
    for (const part of m[7].split(/(<\d\d:\d\d:\d\d\.\d+>)/)) {
      const tag = part.match(/<(\d\d):(\d\d):(\d\d\.\d+)>/);
      if (tag) { t = sec(tag[1], tag[2], tag[3]); continue; }
      for (const ch of part) if (/\S/.test(ch)) chars.push([ch, t]);
    }
  }
  const text = chars.map((c) => c[0]).join('');
  const at = (w) => chars[text.indexOf(w)][1] + VO;
  W = { cmd: at('一行命令'), me: at('我做它'), every: at('每个'), none: at('都不会'), young: at('很年轻'), keep: at('我会'),
    follow: at('现在关注'), share: at('免费入股'), triple: at('一键三连'), late: at('熬夜'), power: at('动力'), last: at('最后'), want: at('你最想'), comm: at('评论区'),
    top: at('点赞最高'), make: at('剪出来'), bye: at('下期见'), regret: at('遗憾'), try: at('想试试'), app: at('客户端') };
  FO = W.follow - 16.54;                                /* the follow block's own times were laid out on 现在关注 at 16.54 */
  DUR = W.bye + 1.95;
}
const set = (el, o, tf) => { o = clamp(o); el.style.opacity = String(o); el.style.visibility = o < 0.002 ? 'hidden' : 'visible'; if (tf !== undefined) el.style.transform = tf; };
const seekTo = (v, s) => new Promise((ok) => {
  const want = Math.min((v.duration || 99) - 0.03, Math.max(0, s));
  const go = () => { if (!v.seeking && v.readyState >= 2 && Math.abs(v.currentTime - want) < 0.002) return ok(); v.addEventListener('seeked', go, { once: true }); if (Math.abs(v.currentTime - want) >= 0.002) v.currentTime = want; };
  go();
});
const fmt = (n) => Math.round(n).toLocaleString('en-US');

const PIC = { x: 203, y: 74.5, w: 780.44, h: 439 };           /* the picture, in the recording's css px (ui-rec/rec-s7.mjs) */
const POSE = {                                          /* the window's point, the place on screen it is at, the scale */
  pic: [PIC.x + PIC.w / 2, PIC.y + PIC.h / 2, 960, 540, 1920 / PIC.w],
  all: [800, 500, 960, 540, 0.96],
};
const mix = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k), lerp(a[3], b[3], k), Math.exp(lerp(Math.log(a[4]), Math.log(b[4]), k))];
function drawWindow(t) {
  const p = mix(POSE.pic, POSE.all, inout(prog(t, 0.45, 2.9)));
  const thru = in3(prog(t, W.me - 0.45, W.me + 0.4)), s = p[4] * (1 + 1.9 * thru);
  set($('#win'), 1 - out3(prog(t, W.me - 0.2, W.me + 0.35)), `translate(${p[2] - p[0] * s}px, ${p[3] - p[1] * s}px) scale(${s})`);
  $('#win').style.filter = thru > 0.01 ? `blur(${6 * thru}px)` : 'none';
  return t < W.me + 0.4 ? seekTo($('#rec'), Math.floor(t * 30 + 1e-6) / 30 + 0.5 / 30) : null;
}

const zc = (t) => 170 * inout(prog(t, W.me + 0.1, W.me + 2.0)) + 560 * inout(prog(t, W.me + 1.55, W.me + 3.8)) + 420 * out3(prog(t, W.me + 3.4, W.me + 6.0));
const camX = (t) => 110 * inout(prog(t, W.me + 0.1, W.me + 6.0)), camY = (t) => -60 * inout(prog(t, W.me + 0.1, W.me + 6.0));
function drawIdeas(t, G) {
  const waits = [];
  if (t < W.me - 0.4 || t > 22.3 + FO) { cards.forEach((c) => { c.el.style.visibility = 'hidden'; }); return waits; }
  /* while the command and the app are up, the films stand back, out of focus, behind them */
  const back = inout(prog(t, W.try - 0.4, W.try + 0.3)) * (1 - inout(prog(t, W.young - 0.6, W.young - 0.15)));
  for (const c of cards) {
    const appear = c.near ? (c.rank === 0 ? W.me + 0.12 : W.every - 0.25 + 0.11 * c.rank) : W.me + 2.1 + rnd(c.i * 4.4) * 1.3;
    const flipAt = c.near ? W.none + 0.12 * c.rank : W.me + 3.6 + rnd(c.i * 6.6) * 1.7;
    const ap = prog(t, appear, appear + 0.6), fp = prog(t, flipAt, flipAt + 0.85);

    let ry = 180 * spring(fp, 1.4, 5.2), rz = c.rz * (1 - 0.6 * out3(fp)), s = 0.8 + 0.2 * spring(ap, 2, 6);

    if (c.near) {                                       /* landed: today's clips on the timeline */

      const [tx, ty] = onScreen(G, CLIP(c.i), 540);

  $('#tl').style.transform = `translate(${G[0]}px, ${G[1]}px) scale(${G[2]})`;

/* ── F · follow (free shares), the triple tap ── */
const BTN = [[1180, 690], [1400, 690], [1620, 690]];
function drawFollow(t) {
  const out = -1150 * in3(prog(t, 21.25 + FO, 21.95 + FO));
  const fi = prog(t, W.follow - 0.1, W.follow + 0.5), up = inout(prog(t, 17.55 + FO, 18.1 + FO)), gone = inout(prog(t, 18.75 + FO, 19.15 + FO));
  const clicked = t >= 17.3 + FO, f = $('#follow');
  f.innerHTML = clicked ? '✓ 已关注' : '<span style="font-weight:600">+</span> 关注';
  f.style.background = clicked ? 'rgba(255,255,255,.1)' : 'linear-gradient(180deg, #ff825d, #e8553a)';
  f.style.color = clicked ? 'rgba(246,244,240,.82)' : '#fff';
  f.style.boxShadow = clicked ? 'inset 0 0 0 1.5px rgba(255,255,255,.16)' : '0 22px 50px rgba(233,85,58,.38)';
  const press = t >= 17.24 + FO && t < 17.34 + FO ? 0.94 : 1;
  set(f, clamp(fi * 3) * (1 - gone), `translate(960px, ${lerp(560, 330, up) - 60 * gone + out}px) translate(-50%, -50%) scale(${(0.7 + 0.3 * spring(fi, 2, 6)) * lerp(1, 0.74, up) * press})`);
  const rp = prog(t, 17.24 + FO, 17.95 + FO);
  set($('#ripple'), (1 - rp) * (rp > 0 ? 0.9 : 0), `translate(960px, ${560 + out}px) scale(${0.4 + 1.5 * out3(rp)})`);
  /* the certificate, stamped */
  const ci = out5(prog(t, W.share - 0.2, W.share + 0.4)), side = inout(prog(t, 18.8 + FO, 19.35 + FO));
  const cx = lerp(960, 600, side), cy = lerp(lerp(940, 690, ci), 690, side) + out;
  set($('#cert'), clamp(ci * 2), `translate(${cx - 460}px, ${cy - 240}px) rotate(${lerp(-4, -1.2, ci) - 1.5 * side}deg) scale(${lerp(1, 0.78, side)})`);
  const hit = W.share + 0.52, sp = prog(t, hit - 0.12, hit);
  set($('#seal'), t < hit - 0.12 ? 0 : 0.92, `rotate(-14deg) scale(${t < hit ? lerp(2.1, 1, in3(sp)) : 1 - 0.05 * Math.sin(Math.PI * prog(t, hit, hit + 0.16))})`);
  /* 一键三连: pressed and held, they fill, they burst */
  const hold = prog(t, 19.05 + FO, 19.9 + FO), burst = t >= 19.92 + FO;
  ['#t0', '#t1', '#t2'].forEach((id, k) => {
    const el = $(id), a = W.triple - 0.05 + 0.08 * k, p = prog(t, a, a + 0.5);
    const pop = burst ? 1 + 0.22 * Math.sin(Math.PI * prog(t, 19.92 + FO + 0.03 * k, 20.3 + FO + 0.03 * k)) : 1 - (hold > 0 && hold < 1 ? 0.04 : 0);
    set(el, clamp(p * 3), `translate(${BTN[k][0]}px, ${BTN[k][1] + out}px) scale(${(0.5 + 0.5 * spring(p, 2, 6)) * pop})`);
    el.querySelector('circle').setAttribute('stroke-dashoffset', String(553 * (1 - (burst ? 1 : inout(hold)))));
    el.querySelector('.rg').style.opacity = String(burst ? 1 - prog(t, 20.0 + FO, 20.4 + FO) : 1);
    const ic = el.querySelector('.ic');
    ic.style.color = burst ? '#ff8458' : 'rgba(246,244,240,.78)';
    ic.querySelectorAll('path, circle').forEach((s, j) => { s.setAttribute('fill', !burst || (k === 1 && j > 0) ? 'none' : k === 1 ? 'rgba(255,132,88,.2)' : '#ff8458'); });
  });
}

/* sparks: out of the three buttons, then up into v0.2 */
const fx = $('#fx').getContext('2d');
function drawSparks(t, G) {
  fx.clearRect(0, 0, 1920, 1080);
  if (t < 19.9 + FO || t > 21.4 + FO) return;
  const [vx0, vy] = onScreen(G, 1654, 540), [vx1] = onScreen(G, 1904, 540);
  fx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 54; i++) {
    const b = BTN[i % 3], a = rnd(i * 3.1) * Math.PI * 2, sp = 70 + 120 * rnd(i * 7.7);
    const bp = prog(t, 19.92 + FO, 20.4 + FO);                    /* the burst */
    if (bp > 0 && bp < 1) {
      const d = sp * out3(bp), px = b[0] + Math.cos(a) * (60 + d), py = b[1] + Math.sin(a) * (60 + d);
      fx.fillStyle = `rgba(255,${150 + 60 * rnd(i)},${100 + 40 * rnd(i * 2)},${0.9 * (1 - bp)})`;
      fx.beginPath(); fx.arc(px, py, 3.2 * (1 - 0.5 * bp), 0, 6.283); fx.fill();
    }
    const s0 = 20.08 + FO + 0.012 * i, tp = prog(t, s0, s0 + 0.62);   /* the stream, landing left to right */
    if (tp > 0 && tp < 1) {
      const ex = lerp(vx0 + 12, vx1 - 12, i / 53), ey = vy + (rnd(i * 9.3) - 0.5) * 30;
      const sx = b[0] + Math.cos(a) * 70, sy = b[1] + Math.sin(a) * 70, cxp = (sx + ex) / 2 + (rnd(i * 4.2) - 0.5) * 300, cyp = Math.min(sy, ey) - 160;
      for (let k = 0; k < 5; k++) {
        const u = inout(clamp(tp - k * 0.03)), q = 1 - u;
        const px = q * q * sx + 2 * q * u * cxp + u * u * ex, py = q * q * sy + 2 * q * u * cyp + u * u * ey;
        fx.fillStyle = `rgba(255,${140 + 70 * rnd(i)},${90 + 40 * rnd(i * 2)},${(0.85 - k * 0.17) * (1 - 0.6 * u)})`;
        fx.beginPath(); fx.arc(px, py, 3.4 - k * 0.5, 0, 6.283); fx.fill();
      }
    }
  }
  fx.globalCompositeOperation = 'source-over';
}

  ['你', '刚刚', ASK, 1, 3568, 'linear-gradient(140deg,#ff9a6b,#e2533a)'],
  ['阿杰', '12 分钟前', '我家猫的一天，它一天要睡二十个小时', 2184, 2301, 'linear-gradient(140deg,#7fb2ff,#4f6bdc)'],
  ['momo', '9 分钟前', '给爸妈的结婚纪念日做一条短片', 1736, 1802, 'linear-gradient(140deg,#c99bff,#8457d6)'],
  ['林小鹿', '3 分钟前', '把两小时的播客剪成 60 秒竖屏', 1209, 1251, 'linear-gradient(140deg,#6fdcb4,#2f9e7c)'],
];
const THUMB = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2.5 10.2h3.6v10.6H2.5zM8.3 10.2l4.1-7.1c.5-.8 1.6-1 2.3-.3.5.5.7 1.2.5 1.9l-1.1 4.4h5.3c1.4 0 2.4 1.3 2 2.7l-2 7.2c-.3 1.1-1.3 1.8-2.4 1.8H8.3Z"/></svg>';
$('#clist').innerHTML = CM.map(([nm, when, tx, , , av]) => `<div class="cm"><div class="av" style="background:${av}">${[...nm][0].toUpperCase()}</div>
  <div class="who"><div class="nm">${nm}<small>${when}</small>${nm === '你' ? '<i>最热</i>' : ''}</div><div class="tx">${tx}</div></div><div class="lk">${THUMB}<b>0</b></div></div>`).join('');
const cmEls = [...document.querySelectorAll('#clist .cm')];
const PANEL = { x: 370, y: 300 }, ROW_H = 118;
function drawComments(t) {
  const pin = out5(prog(t, W.last - 0.05, W.last + 0.5)), gone = inout(prog(t, W.bye - 0.32, W.bye + 0.08));
  set($('#cpanel'), pin * (1 - gone), `translate(${PANEL.x}px, ${PANEL.y + (1 - pin) * 50 - 30 * gone}px)`);
  /* the question, handwritten over it */
  const q = prog(t, W.want - 0.1, W.want + 0.8);
  set($('#ask'), (q > 0 ? 1 : 0) * (1 - gone), `translate(960px, ${PANEL.y - 112 - 30 * gone}px) translateX(-50%)`);
  $('#ask').style.clipPath = `inset(-20% ${100 - 100 * inout(q)}% -20% 0)`;
  /* written in the box, sent */
  const sent = W.comm, n = Math.round([...ASK].length * prog(t, W.want + 0.75, sent - 0.3));
  const blink = Math.floor(t * 2.6) % 2 === 0;
  $('#ctext').innerHTML = t < sent && n > 0 ? `${[...ASK].slice(0, n).join('')}<span class="car"></span>`
    : `<span class="ph">说说你最想让它剪什么…</span>${t > W.want + 0.6 && t < W.want + 0.75 && blink ? '<span class="car" style="margin-left:-4px"></span>' : ''}`;
  const ready = t < sent && n === [...ASK].length;
  $('#send').style.background = ready ? '#ff8458' : 'rgba(255,255,255,.12)';
  $('#send').style.color = ready ? '#fff' : 'rgba(246,244,240,.55)';
  $('#send').style.transform = `scale(${t >= sent - 0.08 && t < sent ? 0.93 : 1})`;
  $('#ccount').textContent = t >= sent ? '1,287' : '1,286';
  /* the list: the others a row down first, then yours in at the top, in the room they left */
  const ins = inout(prog(t, sent, sent + 0.4)), mine = out3(prog(t, sent + 0.25, sent + 0.6));
  cmEls.forEach((el, k) => {
    const [, , , n0, n1] = CM[k];
    let y, o = 1;
    if (k === 0) {
      y = 14 - 20 * (1 - mine); o = mine;
      const c = t < W.top - 0.2 ? 1 : lerp(1, n1, Math.pow(inout(prog(t, W.top - 0.2, W.top + 1.2)), 1.5)) + 7 * Math.max(0, t - W.top - 1.2);
      el.querySelector('b').textContent = fmt(c);
      const lit = inout(prog(t, W.top + 0.9, W.top + 1.3));
      el.style.background = `rgba(255,132,88,${0.08 * lit})`;
      el.querySelector('.nm i').style.opacity = String(lit);
      el.querySelector('.lk').style.color = t > W.top - 0.2 ? '#ffb38f' : '';
    } else {
      y = 14 + ROW_H * (k - 1 + ins);
      el.querySelector('b').textContent = fmt(lerp(n0, n1, inout(prog(t, W.top - 0.1, W.top + 1.3))));
    }
    el.style.transform = `translateY(${y}px)`; el.style.opacity = String(o);
  });
  const hit = W.make, sp = prog(t, hit - 0.13, hit);
  set($('#stamp'), t < hit - 0.13 ? 0 : 0.94 * (1 - gone), `translate(${PANEL.x + 868}px, ${PANEL.y + 76 + 14 + 56 - 30 * gone}px) rotate(-8deg) scale(${0.82 * (t < hit ? lerp(2.2, 1, in3(sp)) : 1 - 0.05 * Math.sin(Math.PI * prog(t, hit, hit + 0.16)))})`);
}

/* ── I · see you ── */
function drawBye(t) {
  const l = out3(prog(t, W.bye - 0.1, W.bye + 0.6));
  set($('#logo'), l, `translate(${960 - 300}px, ${330 + (1 - l) * 16}px) scale(${0.95 + 0.05 * l})`);
  const sw = prog(t, W.bye + 0.75, W.bye + 1.55), at = lerp(-40, 120, sw);
  $('#sweep').style.background = `linear-gradient(105deg, transparent ${at - 18}%, rgba(255,236,210,.9) ${at}%, transparent ${at + 18}%)`;
  set($('#sweep'), sw > 0 && sw < 1 ? 1 : 0, `translate(${960 - 300}px, 330px)`);
  const b = prog(t, W.bye + 0.05, W.bye + 0.85);
  set($('#bye'), b > 0 ? 1 : 0, 'translate(960px, 520px) translateX(-50%)');
  $('#bye').style.clipPath = `inset(-10% ${100 - 100 * inout(b)}% -10% 0)`;
  const k = out3(prog(t, W.bye + 0.75, W.bye + 1.3));
  set($('#links'), k, `translate(960px, ${770 + (1 - k) * 14}px) translateX(-50%)`);
}

/* ── the hand ── */
let HAND = null;                                       /* built once the words are known */
const handKeys = () => [
  [W.app - 0.5, 1740, 1000, 0], [W.app - 0.07, 1448, 696, 1], [W.app + 0.4, 1448, 696, 1], [W.app + 0.8, 1560, 900, 0],
  ...[[16.55, 1560, 900, 0], [16.75, 1430, 820, 1], [17.18, 990, 578, 1], [17.5, 990, 578, 1], [17.9, 1240, 640, 1], [18.62, 1240, 640, 1], [18.98, 1192, 702, 1], [19.95, 1192, 702, 1], [20.4, 1330, 880, 0]].map(([a, ...r]) => [a + FO, ...r]),
  /* to the comment box, a click in it; then to 发送 */
  [W.want + 0.05, 1720, 1010, 0], [W.want + 0.6, 905, 896, 1], [W.comm - 0.42, 905, 896, 1], [W.comm - 0.12, 1442, 896, 1], [W.comm + 0.25, 1442, 896, 1], [W.comm + 0.7, 1560, 1000, 0],
];
function drawHand(t) {
  HAND ??= handKeys();
  let i = 0; while (i + 1 < HAND.length && t >= HAND[i + 1][0]) i++;
  const a = HAND[i], b = HAND[Math.min(i + 1, HAND.length - 1)];
  const k = b[0] > a[0] ? inout(prog(t, a[0], b[0])) : 1;
  const o = t < HAND[0][0] ? 0 : lerp(a[3], b[3], k);
  const down = (t >= W.app && t < W.app + 0.11) || (t >= 17.24 + FO && t < 17.34 + FO) || (t >= 19.02 + FO && t < 19.92 + FO) || (t >= W.want + 0.62 && t < W.want + 0.72) || (t >= W.comm - 0.08 && t < W.comm);
  set($('#cur'), o, `translate(${lerp(a[1], b[1], k) - 6}px, ${lerp(a[2], b[2], k) - 4}px) scale(${down ? 0.86 : 1})`);
}

/* ── the air: warm motes, and grain ── */
const motes = $('#motes').getContext('2d'), grain = $('#grain').getContext('2d'), noise = grain.createImageData(960, 540);
function drawAir(t) {
  motes.clearRect(0, 0, 1920, 1080);
  for (let i = 0; i < 60; i++) {
    const z = rnd(i * 2.2), x = (rnd(i * 1.3) * 2100 + t * (8 + 14 * z)) % 2100 - 90, y = ((rnd(i * 4.7) * 1260 - t * (10 + 26 * z)) % 1260 + 1260) % 1260 - 90;
    const r = 1 + 3.4 * z * z, a = (0.05 + 0.2 * z) * (0.6 + 0.4 * Math.sin(t * (0.8 + z) + i));
    const g = motes.createRadialGradient(x, y, 0, x, y, r * 3);
    g.addColorStop(0, `rgba(255,214,170,${a})`); g.addColorStop(1, 'rgba(255,214,170,0)');
    motes.fillStyle = g; motes.beginPath(); motes.arc(x, y, r * 3, 0, 6.283); motes.fill();
  }
  let s = (Math.floor(t * 30 + 1e-6) * 2654435761 + 1) >>> 0;
  const d = noise.data;
  for (let p = 0; p < d.length; p += 4) { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; d[p] = d[p + 1] = d[p + 2] = s & 255; d[p + 3] = 255; }
  grain.putImageData(noise, 0, 0);
}

function frame(t) {
  const G = groupAt(t);
  const waits = [drawWindow(t)];
  drawInstall(t);
  waits.push(...drawIdeas(t, G));
  drawTimeline(t, G);
  drawFollow(t);
  drawSparks(t, G);
  drawComments(t);
  drawBye(t);
  drawHand(t);
  drawAir(t);
  /* no fade in: S7 opens on S6's last frame, in the app, which has neither vignette nor grain; they come in as it draws back */
  const air = inout(prog(t, 0.45, 2.9));
  $('#vig').style.opacity = String(air); $('#grain').style.opacity = String(0.09 * air);
  $('#black').style.opacity = String(prog(t, DUR - 0.8, DUR - 0.05));
  return Promise.all(waits.filter(Boolean));
}
const loaded = (v) => new Promise((ok) => { if (v.readyState >= 2) ok(); else { v.addEventListener('loadeddata', ok, { once: true }); v.addEventListener('error', ok, { once: true }); } });
const fonts = () => Promise.all(['400 37px Hand', '700 60px Hand', '700 35px Kai', '900 60px Kai'].map((f) => document.fonts.load(f, '想法剪辑股东')));
window.film = { get duration() { return DUR; }, ready: Promise.all([words(), fontsReady(), fonts(), ...[...document.querySelectorAll('video')].map(loaded)]), frame };
</script>
