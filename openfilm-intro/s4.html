<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">

<title>S4 — what it can do, and what it makes</title>
<link rel="stylesheet" href="lib/shared.css">
<style>
  /* S3 ends on OpenFilm's card; S4 opens out of its mark: the mark's playhead drops onto a row of clips and plays it,
     its two clips become the row's first two. The row is the line, cut on its words: each clip one thing it does or one
     film it makes, as long as it is said, and the picture above shows the clip under the playhead. The films'
     filmstrips are their own frames (lib/s4/thumbs, lib/s4/prep.py). */
  #bg { position: absolute; inset: 0; background: radial-gradient(90% 80% at 50% 40%, #16171b 0%, #0b0c0e 58%, #050506 100%); }
  #viewer { position: absolute; left: 288px; top: 98px; width: 1344px; height: 756px; border-radius: 20px; overflow: hidden; background: #0c0d10;
            box-shadow: 0 0 0 1.5px rgba(255,255,255,.08), 0 30px 90px rgba(0,0,0,.55); transform-origin: 50% 50%; }
  .sc { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
  .mg-small { position: absolute; font: 500 17px/1 'Geist Mono', monospace; letter-spacing: .14em; color: rgba(20,20,20,.72); white-space: nowrap; }
  .fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .glass { background: rgba(12,13,16,.64); backdrop-filter: blur(14px); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.13); }
  .mono { font-family: 'Geist Mono', monospace; }
  .chip { position: absolute; height: 52px; padding: 0 22px; border-radius: 14px; display: flex; align-items: center; gap: 12px; white-space: nowrap;
          font: 600 25px/1 'Noto Sans SC', sans-serif; color: #f6f4f0; }
  #name { left: 24px; top: 24px; z-index: 5; }
  #name .ix { font: 500 21px/1 'Geist Mono', monospace; color: rgba(246,244,240,.5); }
  .res { right: 24px; top: 24px; color: #f6f4f0; font-size: 23px; }

  /* the timeline: one row of clips under the picture, the playhead a white line through it */
  #row { position: absolute; inset: 0; -webkit-mask-image: linear-gradient(90deg, transparent 24px, #000 140px, #000 1780px, transparent 1896px); }
  .clip { position: absolute; top: 968px; height: 84px; border-radius: 11px; overflow: hidden; background: #1a1b20; }
  .strip { position: absolute; left: 0; top: 0; height: 84px; display: flex; filter: brightness(.55) saturate(.8); }
  .strip > * { flex: none; width: 150px; height: 84px; object-fit: cover; display: block; box-shadow: inset -1px 0 0 rgba(0,0,0,.35); }
  .clip .ring { position: absolute; inset: 0; border-radius: 11px; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.12); }
  .clip .lab { position: absolute; left: 8px; top: 8px; height: 30px; padding: 0 11px 0 9px; border-radius: 8px; display: flex; align-items: center; gap: 6px; white-space: nowrap;
               font: 600 17px/1 'Noto Sans SC', sans-serif; color: #fff; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); }
  .clip .h { position: absolute; top: 0; width: 10px; height: 84px; background: #f6f4f0; display: none; }
  .clip .h::after { content: ''; position: absolute; left: 4px; top: 30px; width: 2px; height: 24px; border-radius: 1px; background: #111; }
  .clip.on .strip, .clip.lit .strip { filter: none; }
  .clip.on .ring { box-shadow: inset 0 0 0 3px #f6f4f0; }
  .clip.on .h { display: block; }
  /* the playhead: the brand's own, its head over the row and a thin stem through it */
  #ph { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  #ph svg { position: absolute; left: -15px; top: 928px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
  #ph i { position: absolute; left: -2px; top: 956px; width: 4px; height: 110px; border-radius: 2px; background: #f6f4f0; box-shadow: 0 0 0 1px rgba(11,12,14,.45), 0 0 12px rgba(246,244,240,.3); }
  #black { position: absolute; inset: 0; background: #000; }
  #card { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 50% 40%; }
  /* the card's mark, drawn over it where it is, to take apart: the playhead's head and stem, its two clips */
  .mk { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .mk.ghost { pointer-events: none; }
  .clip .glint { position: absolute; inset: 0; border-radius: 11px; pointer-events: none; opacity: 0; mix-blend-mode: screen;
                 background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 48%, rgba(255,255,255,.75) 50%, rgba(255,255,255,.55) 52%, transparent 70%) no-repeat; background-size: 260% 100%; }

  /* 剪口播 */
  .tr { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); height: 80px; padding: 0 34px; border-radius: 20px; display: flex; align-items: center; white-space: nowrap;
        font: 500 40px/1 'Noto Sans SC', sans-serif; color: #f6f4f0; }
  .tr span { display: inline-block; overflow: hidden; vertical-align: bottom; white-space: nowrap; }
  .tr .um { color: #ff7a6e; text-decoration: line-through; text-decoration-thickness: 3px; }
  /* 挑素材 */
  .search { position: absolute; left: 40px; top: 96px; height: 64px; width: 600px; border-radius: 32px; display: flex; align-items: center; gap: 14px; padding: 0 26px;
            font: 500 30px/1 'Noto Sans SC', sans-serif; color: #f6f4f0; background: #1b1c21; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.1); }
  .th { position: absolute; width: 298px; height: 168px; border-radius: 12px; overflow: hidden; background: #000; transform-origin: 0 0; }
  .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .th .ok { position: absolute; inset: 0; border-radius: 12px; box-shadow: inset 0 0 0 5px #f6f4f0; opacity: 0; }
  .th b { position: absolute; right: 10px; top: 10px; width: 40px; height: 40px; border-radius: 50%; background: #f6f4f0; color: #111; font: 700 24px/40px 'Geist', sans-serif; text-align: center; opacity: 0; }
  .tray { position: absolute; left: 40px; top: 560px; width: 1264px; height: 164px; border-radius: 16px; background: rgba(255,255,255,.035); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.1); }
  .tray b { position: absolute; left: 26px; top: 66px; font: 600 26px/1 'Noto Sans SC', sans-serif; color: rgba(246,244,240,.6); }
  /* 加字幕 */
  .subs { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; white-space: nowrap; }
  .subs span { display: inline-block; font: 800 62px/1.2 'Noto Sans SC', sans-serif; color: #fff; padding: 0 4px; text-shadow: 0 3px 18px rgba(0,0,0,.75), 0 0 2px rgba(0,0,0,.9); }
  /* 配音配乐: a night shot, the line it says lit as it is said, and the two lanes a timeline gives them */
  #av-img { transform-origin: 62% 46%; }
  #av-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.66) 100%); }
  #av-line { position: absolute; left: 0; right: 0; top: 488px; text-align: center; white-space: nowrap; font: 600 46px/1 'Noto Sans SC', sans-serif; letter-spacing: .04em;
             color: rgba(255,255,255,.26); text-shadow: 0 2px 16px rgba(0,0,0,.6); }
  #av-line span.on { color: #fff; }
  #av-lanes { position: absolute; left: 50%; bottom: 46px; width: 780px; height: 108px; margin-left: -390px; }
  .lane { position: absolute; left: 0; right: 0; height: 48px; border-radius: 12px; overflow: hidden; }
  .lane .tag { position: absolute; left: 14px; top: 0; height: 48px; display: flex; align-items: center; gap: 8px; font: 600 19px/1 'Noto Sans SC', sans-serif; color: #f6f4f0; }
  .lane svg { position: absolute; left: 112px; top: 0; }
  .lane.vo { top: 0; background: rgba(240,166,135,.15); box-shadow: inset 0 0 0 1.5px rgba(240,166,135,.34); }
  .lane.mu { top: 60px; background: rgba(142,170,255,.13); box-shadow: inset 0 0 0 1.5px rgba(142,170,255,.3); }
  #av-ph { position: absolute; top: -7px; width: 2px; height: 122px; border-radius: 1px; background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.8); }
  /* the films */
  .cell { position: absolute; border-radius: 12px; overflow: hidden; background: #000; }
  .cell .tag { position: absolute; left: 14px; bottom: 12px; font: 600 23px/1 'Noto Sans SC', sans-serif; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.85); }
</style>

<script type="module">
import { clamp, lerp, prog, inout, out3, out5, spring, rnd, fontsReady } from './lib/ease.js';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const VO = 0.55;           /* the voice starts this far into the page (film.html: l4 at 16.67, this page at 16.12): a breath after S3's line */
const VTT = 'assets/audio/vo/l4-v4.vtt';
const DUR = 15.494;          /* a bar longer than the line needs: the score repeats one (film.html section1-score-4c) */
/* what is said, in order: each item's first character is where its clip starts */
const SAID = ['剪口播', '挑素材', '加字幕', '配B-roll', '调色', '做MG动画', '配音配乐', '产品片', '广告', '知识讲解', '绘本', '课件', 'MV', '它都能做'];
let B = null, END = 0;     /* page seconds of each item, and where the voice ends */
async function beats() {
  const raw = await (await fetch(VTT)).text(); const chars = [];
  const sec = (h, mi, s) => +h * 3600 + +mi * 60 + +s;
  for (const cue of raw.split(/\n\n+/)) {
    const m = cue.match(/(\d\d):(\d\d):(\d\d\.\d+) --> (\d\d):(\d\d):(\d\d\.\d+)\n([\s\S]+)/);
    if (!m) continue;
    let t = sec(m[1], m[2], m[3]); END = Math.max(END, sec(m[4], m[5], m[6]));
    for (const part of m[7].split(/(<\d\d:\d\d:\d\d\.\d+>)/)) {
      const tag = part.match(/<(\d\d):(\d\d):(\d\d\.\d+)>/);
      if (tag) { t = sec(tag[1], tag[2], tag[3]); continue; }
      for (const ch of part) if (/\S/.test(ch)) chars.push([ch, t]);
    }
  }
  const text = chars.map((c) => c[0]).join(''); let from = 0; B = {};
  for (const w of SAID) { const i = text.indexOf(w, from); if (i < 0) throw new Error(`not said: ${w}`); B[w] = chars[i][1] + VO; from = i + w.length; }
  END += VO;
}

/* ── the clips: what each one is called, its icon, and its filmstrip's frames ── */
const IC = {
  cut: '<path d="M6 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM8.1 8.1 20 20M8.1 15.9 20 4"/>',
  pick: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  subs: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M7 12h4M13 12h4M7 15.5h7"/>',
  grade: '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/>',
  mg: '<path d="m12 3 2.6 5.6L20 9.3l-4 4 1 5.7-5-2.8-5 2.8 1-5.7-4-4 5.4-.7Z"/>',
  broll: '<rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="7" y="13" width="14" height="7" rx="1.5"/>',
  av: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  film: '<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="m10 9 5 3-5 3Z" fill="currentColor"/>',
};
const icon = (k) => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const img = (src, style = '') => `<img src="${src}" style="${style}">`;
const SEG = { MV: 5.6, 课件: 0.9, 产品片: 2.4, 知识讲解: 1.45 };   /* where these play from: the MV's projector and its beam, the lesson's sheet turning 3D, the product film's site as it fills, the painting folding out into its room */
const FILMS = [['产品片', 'product-film'], ['广告', 'commercial'], ['知识讲解', 'explainer'], ['绘本', 'picture-book'], ['课件', 'education'], ['MV', 'music-video']];
const thumb = (f, k) => `lib/s4/thumbs/${f}-${k}.jpg`;
const frames = {
  cut: (k) => img('assets/image/s4-talk.png', `object-position:${46 + (k % 3) * 2}% 40%`),
  pick: (k) => img(`assets/image/s4-lib-${(k % 8) + 1}.png`),
  subs: (k) => img(`lib/s4/thumbs/video-editing-${k % 6}.jpg`),
  grade: (k) => img('assets/image/s4-grade.png', k ? '' : 'filter:saturate(.32) contrast(.7) brightness(1.12)'),
  mg: (k) => `<svg viewBox="0 0 150 84" style="background:#efe9dd"><circle cx="${108 + (k % 3)}" cy="36" r="${24 - (k % 2) * 2}" fill="#2f5bff"/><path d="M4 84A26 26 0 0 1 56 84Z" fill="#ff4b1f"/><text x="9" y="36" fill="#141414" style="font:900 23px Geist,sans-serif;letter-spacing:-1px">MOTION</text><rect x="10" y="50" width="38" height="10" rx="5" fill="#ffc93c"/></svg>`,
  broll: (k) => img(k % 2 ? 'assets/image/s4-lib-1.png' : 'assets/image/s4-talk.png'),
  av: (k) => img('assets/image/window-city.png', `object-position:${30 + (k % 3) * 15}% 50%`),
};
const CAPS = [['剪口播', 'cut'], ['挑素材', 'pick'], ['加字幕', 'subs'], ['配B-roll', 'broll'], ['调色', 'grade'], ['做MG动画', 'mg'], ['配音配乐', 'av']];
/* every clip on the video track: [the word it starts on, the word after it, label, icon, frame k → html] */
const CLIPS = [
  ...CAPS.map(([n, k], i) => [n, i < CAPS.length - 1 ? CAPS[i + 1][0] : '产品片', n, k, frames[k]]),
  ...FILMS.map(([n, f], i) => [n, i < 5 ? FILMS[i + 1][0] : '它都能做', n, 'film', (k) => img(thumb(f, k % 6))]),
];
const clipsEl = $('#clips');

      c.style.left = `${r[0]}px`; c.style.top = `${r[1]}px`; c.style.width = `${r[2]}px`; c.style.height = `${r[3]}px`;
      c.style.opacity = String(op); c.style.zIndex = String(z);
      c.style.borderRadius = `${lerp(12, 0, r[2] === GW ? 1 : (r[2] - CW) / (GW - CW))}px`;
      c.querySelector('.tag').style.opacity = String(clamp(1 - (r[2] - CW) / 120));
      const from = i === big ? B[FILMS[i][0]] : (i === 5 ? B['MV'] : bEnd);
      if (op > 0) {
        /* each film from its own moment (SEG), at its own speed */
        waits.push(seekTo(VIDS[i], (SEG[FILMS[i][0]] ?? 0.3) + (t - from)));

  }

  })(),

};
